# ==============================================================================
# ESP32-WROVER DEVKIT CI — GitHub Actions
# ==============================================================================
#
# WHAT THIS WORKFLOW IS REALLY ABOUT
# -----------------------------------
#
# This pipeline exists for one simple reason:
# to make sure your ESP32 hardware behaves the same way every time code changes.
#
# This is not a simulator, not a mock, and not a unit-test-only setup.
# There is a real ESP32-WROVER board plugged into a USB port somewhere,
# and this workflow talks to that exact piece of hardware.
#
# Every run follows the same philosophy:
#
# 1. Make sure the runner and tools are sane.
# 2. Make sure the ESP32 is actually reachable over USB.
# 3. Optionally wipe and re-flash it with a known MicroPython firmware.
# 4. Upload real test code onto the device.
# 5. Run those tests directly on the hardware.
# 6. End with one clear verdict: PASS or FAIL.
#
# If this pipeline turns red, it should mean something real broke.
# Not "a script glitched", not "GitHub was weird", but:
# "the board did not behave the way we expected."
#
# ------------------------------------------------------------------------------
#
# HOW TO THINK ABOUT THE STRUCTURE
# --------------------------------
#
# You can mentally divide this into three big phases:
#
# PHASE 1 — SETUP (Jobs 1–3)
#   Get the runner ready:
#   - Define shared CI state.
#   - Clean disk if needed.
#   - Install esptool and mpremote.
#
# PHASE 2 — HARDWARE BRING-UP (Jobs 4–8)
#   Make sure the ESP32 is alive and in a good state:
#   - Check that we can talk to it at all (preflight).
#   - Wait a bit so USB settles.
#   - Optionally erase and re-flash MicroPython.
#   - Optionally wait again.
#   - Optionally poll until the REPL is ready.
#
# PHASE 3 — TESTING (Jobs 9–15)
#   - Copy test files onto the ESP32.
#   - Run system self-test (this is the hard gate).
#   - Run optional tests (temperature, Wi-Fi, Bluetooth, GPS).
#   - Print a readable summary.
#   - Make one final PASS/FAIL decision.
#
# ------------------------------------------------------------------------------
#
# HOW PUSH vs MANUAL RUNS BEHAVE
# ------------------------------
#
# PUSH TO MAIN:
# -------------
# - This is "normal CI mode".
# - All core steps run by default.
# - Flashing is DISABLED on purpose.
#   (You generally do not want every commit wiping your board.)
#
# MANUAL RUN (workflow_dispatch):
# --------------------------------
# - You get a control panel in GitHub UI.
# - You can turn individual steps on or off.
# - Flashing runs ONLY if you explicitly enable it.
# - If you skip optional waits or tests, the pipeline still continues.
#
# ------------------------------------------------------------------------------
#
# DESIGN PRINCIPLES (why this pipeline is written this way)
# ---------------------------------------------------------
#
# 1) HARD GATE: SYSTEM SELF-TEST
#    This test must run and must pass.
#    If it fails, the rest of the pipeline stops.
#
# 2) SKIP TOLERANCE
#    If you choose to skip optional steps (waiting, flashing, optional tests),
#    that should NOT break the pipeline.
#    Only real failures should block progress.
#
# 3) STATE ISOLATION
#    Before Wi-Fi tests, we soft-reset the ESP32 so old network state
#    does not contaminate results.
#
# 4) DETERMINISTIC ORDER
#    Tests run one after another.
#    No parallel jobs fighting over the same physical board.
#
# 5) HARDWARE SAFETY
#    Only one workflow run can access the ESP32 at a time.
#    If a new run starts, the previous one is canceled.
#
# ------------------------------------------------------------------------------
#
# ARTIFACTS AND TRACEABILITY
# --------------------------
# - All test logs (*.txt) are kept.
# - Logs are uploaded even if the pipeline fails.
# - The final verdict is the single source of truth.
#
# ==============================================================================

name: ESP32-WROVER DEVKIT CI

# ------------------------------------------------------------------------------
# TRIGGERS + MANUAL TOGGLES
# ------------------------------------------------------------------------------

on:
  # Normal CI trigger
  push:
    branches: [ main ]

  # Manual trigger with UI toggles
  workflow_dispatch:
    inputs:
      run_init:
        description: "Run JOB 1 — Init CI variables?"
        required: true
        default: "true"

      run_autoclean:
        description: "Run JOB 2 — Auto-clean workspace?"
        required: true
        default: "true"

      run_wait_after_preflight:
        description: "Run JOB 5 — Wait after preflight?"
        required: true
        default: "true"

      # IMPORTANT: default is false so pushes never flash.
      run_flash:
        description: "Run JOB 6 — Flash firmware? (MANUAL ONLY)"
        required: false
        default: "false"

      run_wait_after_flash:
        description: "Run JOB 7 — Wait after flashing?"
        required: true
        default: "true"

      run_wait_for_repl:
        description: "Run JOB 8 — Wait for MicroPython REPL?"
        required: true
        default: "true"

      run_temp:
        description: "Run DS18B20 temperature test?"
        required: false
        default: "true"

      run_wifi:
        description: "Run Wi-Fi tests?"
        required: false
        default: "true"

      run_bt:
        description: "Run Bluetooth tests?"
        required: false
        default: "true"

      run_gps:
        description: "Run GPS tests?"
        required: true
        default: "true"

# ------------------------------------------------------------------------------
# CONCURRENCY — only one workflow can talk to the board at a time
# ------------------------------------------------------------------------------

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT
# ------------------------------------------------------------------------------

env:
  ESP_PORT: COM5
  FIRMWARE: firmware/ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

# ==============================================================================
# JOB 1 — INIT CI VARIABLES
# ==============================================================================
# Establishes a clean, explicit baseline for all test results.
# Even if tests are skipped, we still have predictable variables.
# ==============================================================================
  init-ci-vars:
    runs-on: self-hosted
    if: ${{ inputs.run_init == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

# ==============================================================================
# JOB 2 — AUTO CLEAN
# ==============================================================================
# Defensive step: avoids weird failures when disk is almost full.
# ==============================================================================
  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars
    if: ${{ inputs.run_autoclean == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

# ==============================================================================
# JOB 3 — INSTALL HOST TOOLS
# ==============================================================================
# Ensures we actually have esptool and mpremote available.
# ==============================================================================
  install-tools:
    runs-on: self-hosted
    needs: auto-clean
    steps:
      - shell: cmd
        run: |
          where python
          python --version
          python -c "import serial.tools.list_ports; print([p.device for p in serial.tools.list_ports.comports()])"
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

# ==============================================================================
# JOB 4 — PREFLIGHT
# ==============================================================================
# First reality check: can we even talk to the ESP32?
# If this fails, we stop immediately.
# ==============================================================================
  preflight:
    runs-on: self-hosted
    needs: install-tools
    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

# ==============================================================================
# JOB 5 — WAIT AFTER PREFLIGHT
# ==============================================================================
# Gives USB and the device a moment to settle.
# ==============================================================================
  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight
    if: ${{ inputs.run_wait_after_preflight == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 6 — FLASH FIRMWARE (MANUAL ONLY)
# ==============================================================================
# This wipes the board and installs a clean MicroPython image.
# It will NEVER run on push — only on manual runs with the toggle enabled.
# ==============================================================================
  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_flash == 'true' }}
    steps:
      - shell: cmd
        run: |
          python -m esptool --chip esp32 --port %ESP_PORT% erase_flash
          python -m esptool --chip esp32 --port %ESP_PORT% write_flash -z 0x1000 %FIRMWARE%

# ==============================================================================
# JOB 7 — WAIT AFTER FLASH (SKIP-TOLERANT)
# ==============================================================================
# Runs if flash succeeded OR if flash was skipped.
# Does NOT run if flash actually failed.
# ==============================================================================
  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware
    if: ${{ always() && needs.flash-firmware.result != 'failure' &&
            (inputs.run_wait_after_flash == 'true' || github.event_name == 'push') }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 8 — WAIT FOR REPL (SKIP-TOLERANT)
# ==============================================================================
# Polls MicroPython until it responds.
# ==============================================================================
  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing
    if: ${{ always() && needs.wait-after-flashing.result != 'failure' &&
            (inputs.run_wait_for_repl == 'true' || github.event_name == 'push') }}
    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

# ==============================================================================
# JOB 9 — UPLOAD TEST FILES
# ==============================================================================
# Copies all test modules onto the ESP32 filesystem.
# ==============================================================================
  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl
    if: ${{ always() && needs.wait-for-repl.result != 'failure' }}
    steps:
      - shell: cmd
        run: |
          for %%f in (test_temp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_bt\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_gps\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_selftest_DS18B20_gps_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :

# ==============================================================================
# JOB 10 — SYSTEM SELF TEST (HARD GATE)
# ==============================================================================
# This must run unless something actually failed earlier.
# Skipped steps do NOT block this anymore.
# ==============================================================================
  system-self-test:
    runs-on: self-hosted
    needs: upload-tests
    if: ${{ always() && needs.upload-tests.result != 'failure' }}
    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 11 — TEMPERATURE TEST (OPTIONAL)
# ==============================================================================
  temp-test:
    runs-on: self-hosted
    needs: system-self-test
    if: ${{ always() && needs.system-self-test.result != 'failure' &&
            (inputs.run_temp == 'true' || github.event_name == 'push') }}
    outputs:
      temp_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_ds18b20; test_runner_ds18b20.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 12 — WIFI TEST (OPTIONAL)
# ==============================================================================
  wifi-test:
    runs-on: self-hosted
    needs: temp-test
    if: ${{ always() && needs.temp-test.result != 'failure' &&
            (inputs.run_wifi == 'true' || github.event_name == 'push') }}
    outputs:
      wifi_passed: ${{ steps.result.outputs.passed }}
    steps:
      - shell: powershell
        run: |
          python -m mpremote connect $env:ESP_PORT reset *> $null
          Start-Sleep -Seconds 5
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_wifi_runner; test_wifi_runner.run_all_wifi_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 13 — BLUETOOTH TEST (OPTIONAL)
# ==============================================================================
  bluetooth-test:
    runs-on: self-hosted
    needs: wifi-test
    if: ${{ always() && needs.wifi-test.result != 'failure' &&
            (inputs.run_bt == 'true' || github.event_name == 'push') }}
    outputs:
      bt_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_bt; test_runner_bt.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 14 — GPS TEST (OPTIONAL)
# ==============================================================================
  gps-test:
    runs-on: self-hosted
    needs: bluetooth-test
    if: ${{ always() && needs.bluetooth-test.result != 'failure' &&
            (inputs.run_gps == 'true' || github.event_name == 'push') }}
    outputs:
      gps_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_gps; test_runner_gps.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 15 — FINAL VERDICT + READABLE SUMMARY
# ==============================================================================
  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
      - temp-test
      - wifi-test
      - bluetooth-test
      - gps-test
    if: ${{ always() }}
    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
          $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
          $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
          $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"
          $GPS  = "${{ needs.gps-test.outputs.gps_passed }}"

          # If a job was skipped, GitHub gives us an empty string.
          # We display it as "skipped" in the summary.
          if ($SELF -eq "") { $SELF = "skipped" }
          if ($TEMP -eq "") { $TEMP = "skipped" }
          if ($WIFI -eq "") { $WIFI = "skipped" }
          if ($BT   -eq "") { $BT   = "skipped" }
          if ($GPS  -eq "") { $GPS  = "skipped" }

          Write-Host ""
          Write-Host "================== TEST SUMMARY =================="
          Write-Host "SYSTEM SELF-TEST : $SELF"
          Write-Host "TEMPERATURE TEST : $TEMP"
          Write-Host "WIFI TEST        : $WIFI"
          Write-Host "BLUETOOTH TEST   : $BT"
          Write-Host "GPS TEST         : $GPS"
          Write-Host "=================================================="
          Write-Host ""

          # For the final decision, we treat "skipped" as PASS.
          if ($SELF -eq "skipped") { $SELF = "true" }
          if ($TEMP -eq "skipped") { $TEMP = "true" }
          if ($WIFI -eq "skipped") { $WIFI = "true" }
          if ($BT   -eq "skipped") { $BT   = "true" }
          if ($GPS  -eq "skipped") { $GPS  = "true" }

          if ($SELF -ne "true" -or $TEMP -ne "true" -or $WIFI -ne "true" -or $BT -ne "true" -or $GPS -ne "true") {
            throw "Final verdict: One or more functional tests failed"
          }

          Write-Host "FINAL VERDICT: ALL TESTS PASSED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"
