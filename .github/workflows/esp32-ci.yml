name: ESP32-WROVER DEVKIT CI

# ==============================================================================
# ESP32-WROVER DEVKIT CI PIPELINE 
# ==============================================================================
#
# This is not a “normal” software CI pipeline.
#
# This is a remote lab test bench for a real ESP32-WROVER board that is
# physically plugged into a specific self-hosted machine.
#
# What that means in practice:
# - Every test talks to real silicon over USB.
# - Failures usually mean something is wrong with hardware, firmware,
#   cabling, or the physical environment — not just code.
#
# How to read the result:
#   GREEN  → The physical board behaved exactly as expected.
#   RED    → Something in the real system broke.
#
# What this is NOT:
# - Not a simulator
# - Not a mock
# - Not a pure unit-test pipeline
#
# What this IS:
# - Hardware-in-the-loop CI
# - Firmware/hardware integration testing
# - Real peripheral validation (Wi-Fi, Bluetooth, GPS, Temperature, TCP/IP)
#
# ------------------------------------------------------------------------------
# PIPELINE ARCHITECTURE (how I mentally structure this)
# ------------------------------------------------------------------------------
#
# PHASE 1 — SETUP (Jobs 1–3)
#   Make the runner sane and predictable.
#   Clean workspace, install tools, set baseline state.
#
# PHASE 2 — HARDWARE BRING-UP (Jobs 4–8)
#   Make sure the ESP32 is alive, reachable, and ready.
#   Optional waits exist because microcontrollers need time.
#
# PHASE 3 — TESTING (Jobs 9–16)
#   Upload real tests, run them on real hardware in sequence,
#   then produce one clear final verdict.
#
# ------------------------------------------------------------------------------
# DESIGN PRINCIPLES (these drive everything below)
# ------------------------------------------------------------------------------
#
# 1) HARD GATE — SYSTEM SELF-TEST
#    If this fails, nothing else matters.
#    GPS, Wi-Fi, Bluetooth, Temperature, and TCP all depend on this.
#
# 2) SKIP TOLERANCE
#    Optional tests can be skipped.
#    Skipping is not a failure.
#
# 3) STATE ISOLATION
#    I reset before Wi-Fi tests to avoid stale network state.
#
# 4) DETERMINISTIC ORDER
#    Tests run sequentially — no parallel fights over hardware.
#
# 5) HARDWARE SAFETY
#    Only one workflow can talk to the board at a time.
#
# 6) ARTIFACT PRESERVATION
#    Logs are uploaded even on failure for debugging.
# ==============================================================================

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      # -----------------------------------------------------------------------
      # SETUP / BRING-UP CONTROLS
      # -----------------------------------------------------------------------
      #
      # These are “runner maintenance” controls.
      # I normally leave all of these true.
      #
      # I only change them when debugging the CI machine itself,
      # not when debugging the ESP32.
      # -----------------------------------------------------------------------

      run_init:
        description: "Run JOB 1 — Init CI variables?"
        required: true
        default: "true"

      run_autoclean:
        description: "Run JOB 2 — Auto-clean workspace?"
        required: true
        default: "true"

      run_wait_after_preflight:
        description: "Run JOB 5 — Wait after preflight?"
        required: true
        default: "true"

      # Flashing is MANUAL ONLY by design.
      #
      # I do NOT want CI to automatically reflash firmware on every run.
      # Flashing can:
      # - change board state,
      # - introduce new failures,
      # - or mask real stability problems.
      #
      # If this is true, it means a human explicitly clicked it.
      run_flash:
        description: "Run JOB 6 — Flash firmware? (MANUAL ONLY)"
        required: false
        default: "false"

      run_wait_after_flash:
        description: "Run JOB 7 — Wait after flashing?"
        required: true
        default: "true"

      run_wait_for_repl:
        description: "Run JOB 8 — Wait for MicroPython REPL?"
        required: true
        default: "true"

      # -----------------------------------------------------------------------
      # QUICK vs FULL MODE
      # -----------------------------------------------------------------------
      #
      # QUICK MODE (default)
      # - Always runs: system self-test (hard gate)
      # - Always runs: GPS (unless explicitly disabled)
      # - Always runs: TCP/IP tests (my current choice)
      # - Fast and safe for every push.
      #
      # FULL MODE
      # - Runs ONLY the tests explicitly enabled below.
      # - Not “run everything by default.”
      # - Intended for releases, deep validation, or debugging.
      #
      # Flashing is always manual-only, regardless of mode.
      # -----------------------------------------------------------------------

      test_mode:
        description: "Test mode: quick or full?"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

      # -----------------------------------------------------------------------
      # INDIVIDUAL TEST TOGGLES
      # -----------------------------------------------------------------------
      #
      # Core rule I care about:
      #
      #   false = skip, ALWAYS.
      #   true  = run.
      #
      # Full mode does NOT override these toggles.
      # If I set something to false, I really mean skip it.
      #
      # This prevents “full mode magically forcing tests”
      # that I explicitly disabled.
      # -----------------------------------------------------------------------

      run_tcp:
        description: "Run TCP/IP tests?"
        required: false
        default: "false"

      run_temp:
        description: "Run DS18B20 temperature test?"
        required: false
        default: "false"

      run_wifi:
        description: "Run Wi-Fi tests?"
        required: false
        default: "false"

      run_bt:
        description: "Run Bluetooth tests?"
        required: false
        default: "false"

      run_gps:
        description: "Run GPS tests?"
        required: true
        default: "true"

# ------------------------------------------------------------------------------
# CONCURRENCY — protects the physical board
# ------------------------------------------------------------------------------
#
# Only ONE workflow can talk to the ESP32 at a time.
#
# If a new run starts:
# - the previous one is cancelled,
# - avoiding USB contention,
# - corrupted serial communication,
# - or inconsistent test results.
# ------------------------------------------------------------------------------

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT
# ------------------------------------------------------------------------------

env:
  ESP_PORT: COM5
  FIRMWARE: firmware/ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  # ==============================================================================
  # JOB 1 — INIT CI VARIABLES
  # ==============================================================================
  #
  # I initialize all “test passed” flags here so:
  # - the final summary job always has something to read,
  # - even if earlier jobs were skipped,
  # - and we don’t get empty or undefined values later.
  # ==============================================================================
  init-ci-vars:
    runs-on: self-hosted
    if: ${{ inputs.run_init == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TCP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

  # ==============================================================================
  # JOB 2 — AUTO CLEAN
  # ==============================================================================
  #
  # Simple guardrail so the self-hosted runner doesn’t run out of disk.
  #
  # If free space < 10 GB:
  # - wipe the workspace aggressively,
  # otherwise:
  # - leave it alone to save time.
  # ==============================================================================
  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars
    if: ${{ inputs.run_autoclean == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

  # ==============================================================================
  # JOB 3 — INSTALL HOST TOOLS
  # ==============================================================================
  #
  # Make sure the runner has exactly what we rely on:
  # - esptool  → flashing and low-level control
  # - mpremote → talking to MicroPython over serial
  # ==============================================================================
  install-tools:
    runs-on: self-hosted
    needs: auto-clean
    steps:
      - shell: cmd
        run: |
          where python
          python --version
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

  # ==============================================================================
  # JOB 4 — PREFLIGHT
  # ==============================================================================
  #
  # Basic sanity check:
  # Can we even talk to the ESP32 over USB?
  #
  # If this fails, likely causes are:
  # - bad cable,
  # - wrong COM port,
  # - board not powered,
  # - MicroPython not responding.
  #
  # If we can’t pass this, there is no point continuing.
  # ==============================================================================
  preflight:
    runs-on: self-hosted
    needs: install-tools
    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

  # ==============================================================================
  # JOB 5 — WAIT AFTER PREFLIGHT
  # ==============================================================================
  #
  # Give the board time to settle after reset.
  # USB serial can be flaky if we rush.
  # ==============================================================================
  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight
    if: ${{ inputs.run_wait_after_preflight == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

  # ==============================================================================
  # JOB 6 — FLASH FIRMWARE (MANUAL ONLY)
  # ==============================================================================
  #
  # This never runs automatically.
  # A human must explicitly click it.
  #
  # I keep this manual because flashing:
  # - changes board state,
  # - can introduce new failures,
  # - and should be a deliberate action.
  # ==============================================================================
  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_flash == 'true' }}
    steps:
      - shell: cmd
        run: |
          python -m esptool --chip esp32 --port %ESP_PORT% erase_flash
          python -m esptool --chip esp32 --port %ESP_PORT% write_flash -z 0x1000 %FIRMWARE%

  # ==============================================================================
  # JOB 7 — WAIT AFTER FLASH
  # ==============================================================================
  #
  # Two cases:
  # 1) Flashing was skipped → we proceed normally.
  # 2) Flashing ran → give the board time to reboot.
  #
  # If flashing truly failed, we stop.
  # ==============================================================================
  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware
    if: ${{ always() && needs.flash-firmware.result != 'failure' &&
            (inputs.run_wait_after_flash == 'true' || github.event_name == 'push') }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

  # ==============================================================================
  # JOB 8 — WAIT FOR REPL
  # ==============================================================================
  #
  # I actively poll until MicroPython responds.
  #
  # If it never prints "READY":
  # - firmware might be broken,
  # - board might be hung,
  # - or serial is unreliable.
  #
  # In that case, we fail fast.
  # ==============================================================================
  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing
    if: ${{ always() && needs.wait-after-flashing.result != 'failure' &&
            (inputs.run_wait_for_repl == 'true' || github.event_name == 'push') }}
    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

  # ==============================================================================
  # JOB 9 — UPLOAD TEST FILES
  # ==========
