# ==============================================================================
# ESP32-WROVER DEVKIT CI — GitHub Actions Overview
# by Ebesoh Ebesoh
# ==============================================================================
#
# WHAT THIS IS
# -----------
# This workflow is a hardware-in-the-loop CI pipeline for ESP32-WROVER boards
# running MicroPython.
#
# It doesn’t simulate anything. It talks to a real board over USB, flashes
# firmware, pushes test code, runs validation directly on the device, and then
# decides—clearly and unambiguously—whether the hardware passes or fails.
#
# The goal is simple: repeatable, trustworthy hardware validation that you can
# run every time without wondering what state the board is in.
#
# ------------------------------------------------------------------------------
#
# HOW IT RUNS (HIGH LEVEL)
# -----------------------
#
# 1. Runner setup
#    The runner prepares itself:
#    - CI state variables are initialized
#    - Disk space is checked and cleaned if needed
#    - Required tools (Python, esptool, mpremote) are installed
#
# 2. Hardware bring-up
#    The ESP32 is brought to a known-good baseline:
#    - USB connectivity is verified
#    - Flash is fully erased
#    - A known MicroPython firmware image is installed
#    - The workflow waits until the REPL is actually responsive
#
# 3. Test deployment
#    All test modules are uploaded directly to the ESP32 filesystem using
#    mpremote. No magic, no side channels.
#
# 4. Test execution (strict order)
#    Tests run one at a time, in a fixed sequence:
#    - System self-test (hard gate — must pass)
#    - DS18B20 temperature sensor test
#    - Soft reset to clear network state
#    - Wi-Fi functional tests
#    - Bluetooth (BLE) functional tests
#
# 5. Final verdict
#    Results from all tests are collected and evaluated.
#    The workflow emits a single, authoritative PASS or FAIL.
#    Logs are archived for debugging and traceability.
#
# ------------------------------------------------------------------------------
#
# DESIGN CHOICES (WHY IT’S BUILT THIS WAY)
# ----------------------------------------
#
# • HARD GATES
#   The system self-test is non-negotiable. If it fails, nothing else runs.
#   This prevents false confidence from downstream tests.
#
# • STATE ISOLATION
#   Network-related tests are separated by an intentional reset to avoid
#   leftover sockets, drivers, or radio state contaminating results.
#
# • ONE SOURCE OF TRUTH
#   Each test explicitly reports PASS or FAIL using a clear marker.
#   CI decisions are made by parsing those markers—nothing implicit.
#
# • DETERMINISM OVER SPEED
#   Tests are run sequentially on purpose. Parallelism is avoided because
#   shared hardware doesn’t forgive race conditions.
#
# • HARDWARE SAFETY
#   The workflow assumes exclusive access to the ESP32. Concurrent runs against
#   the same physical board are intentionally blocked.
#
# ------------------------------------------------------------------------------
#
# RESULTS AND ARTIFACTS
# --------------------
# - All test output is written to log files
# - CI decisions are based solely on explicit verdict markers
# - Logs are always uploaded as artifacts, even on failure
# - The final workflow result is clear, explicit, and final
#
# ------------------------------------------------------------------------------
#
# WHEN TO USE THIS
# ----------------
# - Self-hosted GitHub Actions runners with direct USB access
# - Firmware, driver, or board-level development
# - Regression testing after hardware or firmware changes
#
# This workflow is intentionally conservative and explicit.
# It favors clarity, repeatability, and hardware safety over speed or cleverness.
#
# ==============================================================================

name: ESP32-WROVER DEVKIT CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

env:
  ESP_PORT: COM5
  FIRMWARE: firmware/ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"

jobs:

# ==============================================================================
# JOB 1 — INIT CI VARIABLES
# ==============================================================================

  init-ci-vars:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

# ==============================================================================
# JOB 2 — AUTO CLEAN
# ==============================================================================

  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars
    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

# ==============================================================================
# JOB 3 — INSTALL HOST TOOLS
# ==============================================================================

  install-tools:
    runs-on: self-hosted
    needs: auto-clean
    steps:
      - shell: cmd
        run: |
          where python
          python --version
          python -c "import serial.tools.list_ports; print([p.device for p in serial.tools.list_ports.comports()])"
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

# ==============================================================================
# JOB 4 — PREFLIGHT
# ==============================================================================

  preflight:
    runs-on: self-hosted
    needs: install-tools
    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

# ==============================================================================
# JOB 5 — WAIT AFTER PREFLIGHT
# ==============================================================================

  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 6 — FLASH FIRMWARE
# ==============================================================================

  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight
    steps:
      - shell: cmd
        run: |
          python -m esptool --chip esp32 --port %ESP_PORT% erase-flash
          python -m esptool --chip esp32 --port %ESP_PORT% write-flash -z 0x1000 %FIRMWARE%

# ==============================================================================
# JOB 7 — WAIT AFTER FLASH
# ==============================================================================

  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 8 — WAIT FOR REPL
# ==============================================================================

  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing
    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

# ==============================================================================
# JOB 9 — UPLOAD TEST FILES
# ==============================================================================

  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl
    steps:
      - shell: cmd
        run: |
          for %%f in (test_temp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_bt\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_selftest_DS18B20_gps_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :

# ==============================================================================
# JOB 10 — SYSTEM SELF TEST (EXPORTS OUTPUT)
# ==============================================================================

  system-self-test:
    runs-on: self-hosted
    needs: upload-tests

    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}

    steps:
      - name: System Self-Test
        id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 11 — TEMPERATURE TEST
# ==============================================================================

  temp-test:
    runs-on: self-hosted
    needs: system-self-test

    outputs:
      temp_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_ds18b20; test_runner_ds18b20.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 12 — WIFI TEST
# ==============================================================================

  wifi-test:
    runs-on: self-hosted
    needs: temp-test

    outputs:
      wifi_passed: ${{ steps.result.outputs.passed }}

    steps:
      - shell: powershell
        run: |
          python -m mpremote connect $env:ESP_PORT reset *> $null
          Start-Sleep -Seconds 5
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_wifi_runner; test_wifi_runner.run_all_wifi_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 13 — BLUETOOTH TEST
# ==============================================================================

  bluetooth-test:
    runs-on: self-hosted
    needs: wifi-test

    outputs:
      bt_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_bt; test_runner_bt.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 14 — FINAL VERDICT
# ==============================================================================

  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
      - temp-test
      - wifi-test
      - bluetooth-test

    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
          $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
          $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
          $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"

          Write-Host "SELF_TEST_PASSED = $SELF"
          Write-Host "TEMP_TEST_PASSED = $TEMP"
          Write-Host "WIFI_TEST_PASSED = $WIFI"
          Write-Host "BT_TEST_PASSED   = $BT"

          if ($SELF -ne "true") {
            throw "Final verdict: System Self-Test failed"
          }

          if ($TEMP -ne "true" -or $WIFI -ne "true" -or $BT -ne "true") {
            throw "Final verdict: One or more functional tests failed"
          }

          Write-Host "FINAL VERDICT: ALL TESTS PASSED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"


