# ==============================================================================
# ESP32-WROVER DEVKIT CI — GitHub Actions (Updated Notes)
# ==============================================================================
#
# WHAT THIS WORKFLOW DOES
# -----------------------
# This is a hardware-in-the-loop (HIL) CI pipeline for ESP32-WROVER boards
# running MicroPython. It does not use simulators or mocks.
#
# The workflow:
# - Talks to a real ESP32 board over USB
# - Flashes a known MicroPython firmware image
# - Uploads test code to the device
# - Executes tests directly on the hardware
# - Produces a single, clear PASS/FAIL verdict at the end
#
# The core goal is repeatability: every run brings the board to a known state
# before any testing begins.
#
# ------------------------------------------------------------------------------

# HOW THE PIPELINE IS STRUCTURED
# ------------------------------
#
# SETUP PHASE (Jobs 1, 2, 3)
# 1. Init CI variables
#    Creates explicit pass/fail markers used across the workflow.
#
# 2. Auto-clean (optional)
#    Cleans workspace if disk space is critically low.
#
# 3. Install host tools
#    Ensures Python, esptool, and mpremote are available on the runner.
#
# HARDWARE BRING-UP (Jobs 4, 5, 6, 7, 8)
# 4. Preflight
#    Checks that the ESP32 is reachable over USB before doing anything destructive.
#
# 5. Wait after preflight (optional)
#    Gives USB and device state time to settle.
#
# 6. Flash firmware (optional)
#    Erases flash and installs a clean MicroPython image.
#
# 7. Wait after flashing (optional)
#    Allows the ESP32 to reboot properly.
#
# 8. Wait for REPL (optional)
#    Polls MicroPython until it responds.
#
# TEST DEPLOYMENT (Job 9)
# 9. Upload test files
#    Copies all Python test modules onto the ESP32 filesystem via mpremote.
#
# TEST EXECUTION (Jobs 10–14)
# 10. System Self-Test (HARD GATE)
#     If this fails, the pipeline stops immediately.
#
# 11. Temperature Test (optional)
#     Validates DS18B20 sensor behavior.
#
# 12. Wi-Fi Test (optional)
#     Includes a soft reset before running to avoid stale network state.
#
# 13. Bluetooth Test (optional)
#     Runs BLE functional validation.
#
# 14. GPS Test (optional)
#     Validates GT-U7 GPS via UART and NMEA parsing.
#
# FINAL DECISION (Job 15)
# 15. Final Verdict
#     Aggregates results from all previous jobs and emits a single PASS/FAIL.
#
# ------------------------------------------------------------------------------

# MANUAL CONTROL (IMPORTANT UPDATE)
# ----------------------------------
# When triggered manually, you can now enable or disable:
#
# - Job 1: Init CI variables
# - Job 2: Auto-clean
# - Job 5: Wait after preflight
# - Job 6: Flash firmware
# - Job 7: Wait after flash
# - Job 8: Wait for REPL
#
# You can also toggle individual test suites:
# - Temperature test
# - Wi-Fi test
# - Bluetooth test
# - GPS test
#
# On pushes to main, everything still runs by default.
#
# ------------------------------------------------------------------------------

# DESIGN PRINCIPLES
# -----------------
#
# HARD GATES
# The system self-test is mandatory. If it fails, no further testing continues.
#
# STATE ISOLATION
# A soft reset is performed before Wi-Fi testing to avoid leftover radio or
# network state affecting results.
#
# SINGLE SOURCE OF TRUTH
# Each test suite reports a clear PASS/FAIL verdict that the workflow respects.
#
# DETERMINISTIC ORDER
# Tests run sequentially to avoid race conditions on shared hardware.
#
# HARDWARE SAFETY
# Concurrency is limited so only one workflow can access the ESP32 at a time.
#
# ------------------------------------------------------------------------------

# ARTIFACTS AND TRACEABILITY
# --------------------------
# - All test logs are saved as *.txt files
# - Logs are always uploaded as artifacts, even on failure
# - Final verdict is explicit and authoritative
#
# ==============================================================================

name: ESP32-WROVER DEVKIT CI

# ------------------------------------------------------------------------------
# Workflow triggers + manual toggles (including setup jobs + tests)
# ------------------------------------------------------------------------------

on:
  # Automatic execution on every push to main
  push:
    branches: [ main ]

  # Manual execution with UI toggles in GitHub
  workflow_dispatch:
    inputs:
      run_init:
        description: "Run JOB 1 — Init CI variables?"
        required: true
        default: "true"

      run_autoclean:
        description: "Run JOB 2 — Auto-clean workspace?"
        required: true
        default: "true"

      run_wait_after_preflight:
        description: "Run JOB 5 — Wait after preflight?"
        required: true
        default: "true"

      run_flash:
        description: "Run JOB 6 — Flash firmware?"
        required: false
        default: "true"

      run_wait_after_flash:
        description: "Run JOB 7 — Wait after flashing?"
        required: true
        default: "true"

      run_wait_for_repl:
        description: "Run JOB 8 — Wait for MicroPython REPL?"
        required: true
        default: "true"

      run_temp:
        description: "Run DS18B20 temperature test?"
        required: true
        default: "true"

      run_wifi:
        description: "Run Wi-Fi tests?"
        required: true
        default: "true"

      run_bt:
        description: "Run Bluetooth tests?"
        required: true
        default: "true"

      run_gps:
        description: "Run GPS tests?"
        required: true
        default: "true"

# ------------------------------------------------------------------------------
# Concurrency control — prevents two runs from touching the same ESP32
# ------------------------------------------------------------------------------

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# Global environment variables shared across all jobs
# ------------------------------------------------------------------------------

env:
  ESP_PORT: COM5
  FIRMWARE: firmware/ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"

jobs:

# ==============================================================================
# JOB 1 — INIT CI VARIABLES
# ==============================================================================
# Creates explicit state flags that downstream jobs rely on

  init-ci-vars:
    runs-on: self-hosted

    # Only run if manually enabled OR if this is a push to main
    if: ${{ inputs.run_init == 'true' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

# ==============================================================================
# JOB 2 — AUTO CLEAN
# ==============================================================================
# Optional cleanup to avoid disk-space failures

  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars

    if: ${{ inputs.run_autoclean == 'true' || github.event_name == 'push' }}

    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

# ==============================================================================
# JOB 3 — INSTALL HOST TOOLS
# ==============================================================================
# Ensures esptool and mpremote are available

  install-tools:
    runs-on: self-hosted
    needs: auto-clean

    steps:
      - shell: cmd
        run: |
          where python
          python --version
          python -c "import serial.tools.list_ports; print([p.device for p in serial.tools.list_ports.comports()])"
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

# ==============================================================================
# JOB 4 — PREFLIGHT
# ==============================================================================
# Checks that the ESP32 is reachable before erasing or flashing

  preflight:
    runs-on: self-hosted
    needs: install-tools

    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

# ==============================================================================
# JOB 5 — WAIT AFTER PREFLIGHT
# ==============================================================================
# Gives USB and device state time to settle

  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight

    if: ${{ inputs.run_wait_after_preflight == 'true' || github.event_name == 'push' }}

    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 6 — FLASH FIRMWARE
# ==============================================================================
# Erases flash and writes a clean MicroPython image

  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight

    if: ${{ inputs.run_flash == 'true' && github.event_name == 'push' }}

    steps:
      - shell: cmd
        run: |
          python -m esptool --chip esp32 --port %ESP_PORT% erase-flash
          python -m esptool --chip esp32 --port %ESP_PORT% write-flash -z 0x1000 %FIRMWARE%

# ==============================================================================
# JOB 7 — WAIT AFTER FLASH
# ==============================================================================
# Allows the ESP32 to reboot cleanly after flashing

  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware

    if: ${{ inputs.run_wait_after_flash == 'true' || github.event_name == 'push' }}

    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 8 — WAIT FOR REPL
# ==============================================================================
# Polls MicroPython until it responds

  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing

    if: ${{ inputs.run_wait_for_repl == 'true' || github.event_name == 'push' }}

    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

# ==============================================================================
# JOB 9 — UPLOAD TEST FILES
# ==============================================================================
# Copies all test modules to the ESP32 filesystem

  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl

    steps:
      - shell: cmd
        run: |
          for %%f in (test_temp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_bt\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_gps\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_selftest_DS18B20_gps_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :

# ==============================================================================
# JOB 10 — SYSTEM SELF TEST (HARD GATE)
# ==============================================================================
# If this fails, the pipeline stops

  system-self-test:
    runs-on: self-hosted
    needs: upload-tests

    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 11 — TEMPERATURE TEST
# ==============================================================================
# Optional DS18B20 validation

  temp-test:
    runs-on: self-hosted
    needs: system-self-test

    if: ${{ inputs.run_temp == 'true' || github.event_name == 'push' }}

    outputs:
      temp_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_ds18b20; test_runner_ds18b20.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 12 — WIFI TEST
# ==============================================================================
# Includes a soft reset before running

  wifi-test:
    runs-on: self-hosted
    needs: temp-test

    if: ${{ inputs.run_wifi == 'true' || github.event_name == 'push' }}

    outputs:
      wifi_passed: ${{ steps.result.outputs.passed }}

    steps:
      - shell: powershell
        run: |
          python -m mpremote connect $env:ESP_PORT reset *> $null
          Start-Sleep -Seconds 5

      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_wifi_runner; test_wifi_runner.run_all_wifi_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 13 — BLUETOOTH TEST
# ==============================================================================
# BLE functional validation

  bluetooth-test:
    runs-on: self-hosted
    needs: wifi-test

    if: ${{ inputs.run_bt == 'true' || github.event_name == 'push' }}

    outputs:
      bt_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_bt; test_runner_bt.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 14 — GPS TEST
# ==============================================================================
# Validates GT-U7 GPS via UART

  gps-test:
    runs-on: self-hosted
    needs: bluetooth-test

    if: ${{ inputs.run_gps == 'true' || github.event_name == 'push' }}

    outputs:
      gps_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_gps; test_runner_gps.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 15 — FINAL VERDICT
# ==============================================================================
# Single authoritative decision based on all previous jobs

  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
      - temp-test
      - wifi-test
      - bluetooth-test
      - gps-test

    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
          $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
          $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
          $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"
          $GPS  = "${{ needs.gps-test.outputs.gps_passed }}"

          if ($SELF -ne "true" -or $TEMP -ne "true" -or $WIFI -ne "true" -or $BT -ne "true" -or $GPS -ne "true") {
            throw "Final verdict: One or more functional tests failed"
          }

          Write-Host "FINAL VERDICT: ALL TESTS PASSED"

      # Always archive logs for traceability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"
