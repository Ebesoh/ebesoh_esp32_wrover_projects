name: ESP32-WROVER DEVKIT CI

# ==============================================================================
# ESP32-WROVER DEVKIT CI PIPELINE — TOP-LEVEL INTENT
# ==============================================================================
#
# This is not a “normal” software CI pipeline.
#
# This is a remote lab test bench for a real ESP32-WROVER board that is
# physically plugged into a specific self-hosted machine.
#
# What that means in practice:
# - Every test talks to real silicon over USB.
# - Failures usually mean something is wrong with hardware, firmware,
#   cabling, or the physical environment — not just code.
#
# How to read the result:
#   GREEN  → The physical board behaved exactly as expected.
#   RED    → Something in the real system broke.
#
# What this is NOT:
# - Not a simulator
# - Not a mock
# - Not a pure unit-test pipeline
#
# What this IS:
# - Hardware-in-the-loop CI
# - Firmware/hardware integration testing
# - Real peripheral validation (Wi-Fi, Bluetooth, GPS, Temperature, TCP/IP)
#
# ------------------------------------------------------------------------------
# PIPELINE ARCHITECTURE (how I mentally structure this)
# ------------------------------------------------------------------------------
#
# PHASE 1 — SETUP (Jobs 1–3)
#   Make the runner sane and predictable.
#   Clean workspace, install tools, set baseline state.
#
# PHASE 2 — HARDWARE BRING-UP (Jobs 4–8)
#   Make sure the ESP32 is alive, reachable, and ready.
#   Optional waits exist because microcontrollers need time.
#
# PHASE 3 — TESTING (Jobs 9–16)
#   Upload real tests, run them on real hardware in sequence,
#   then produce one clear final verdict.
#
# ------------------------------------------------------------------------------
# DESIGN PRINCIPLES (these drive everything below)
# ------------------------------------------------------------------------------
#
# 1) HARD GATE — SYSTEM SELF-TEST
#    If this fails, nothing else matters.
#    GPS, Wi-Fi, Bluetooth, Temperature, and TCP all depend on this.
#
# 2) SKIP TOLERANCE
#    Optional tests can be skipped.
#    Skipping is not a failure.
#
# 3) STATE ISOLATION
#    I reset before Wi-Fi tests to avoid stale network state.
#
# 4) DETERMINISTIC ORDER
#    Tests run sequentially — no parallel fights over hardware.
#
# 5) HARDWARE SAFETY
#    Only one workflow can talk to the board at a time.
#
# 6) ARTIFACT PRESERVATION
#    Logs are uploaded even on failure for debugging.
# ==============================================================================

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      # -----------------------------------------------------------------------
      # SETUP / BRING-UP CONTROLS
      # -----------------------------------------------------------------------
      #
      # These are “runner maintenance” controls.
      # I normally leave all of these true.
      #
      # I only change them when debugging the CI machine itself,
      # not when debugging the ESP32.
      # -----------------------------------------------------------------------

      run_init:
        description: "Run JOB 1 — Init CI variables?"
        required: true
        default: "true"

      run_autoclean:
        description: "Run JOB 2 — Auto-clean workspace?"
        required: true
        default: "true"

      run_wait_after_preflight:
        description: "Run JOB 5 — Wait after preflight?"
        required: true
        default: "true"

      # Flashing is MANUAL ONLY by design.
      #
      # I do NOT want CI to automatically reflash firmware on every run.
      # Flashing can:
      # - change board state,
      # - introduce new failures,
      # - or mask real stability problems.
      #
      # If this is true, it means a human explicitly clicked it.
      run_flash:
        description: "Run JOB 6 — Flash firmware? (MANUAL ONLY)"
        required: false
        default: "false"

      run_wait_after_flash:
        description: "Run JOB 7 — Wait after flashing?"
        required: true
        default: "true"

      run_wait_for_repl:
        description: "Run JOB 8 — Wait for MicroPython REPL?"
        required: true
        default: "true"

      # -----------------------------------------------------------------------
      # QUICK vs FULL MODE
      # -----------------------------------------------------------------------
      #
      # QUICK MODE (default)
      # - Always runs: system self-test (hard gate)
      # - Always runs: GPS (unless explicitly disabled)
      # - Always runs: TCP/IP tests (my current choice)
      # - Fast and safe for every push.
      #
      # FULL MODE
      # - Runs ONLY the tests explicitly enabled below.
      # - Not “run everything by default.”
      # - Intended for releases, deep validation, or debugging.
      #
      # Flashing is always manual-only, regardless of mode.
      # -----------------------------------------------------------------------

      test_mode:
        description: "Test mode: quick or full?"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

      # -----------------------------------------------------------------------
      # INDIVIDUAL TEST TOGGLES
      # -----------------------------------------------------------------------
      #
      # Core rule I care about:
      #
      #   false = skip, ALWAYS.
      #   true  = run.
      #
      # Full mode does NOT override these toggles.
      # If I set something to false, I really mean skip it.
      #
      # This prevents “full mode magically forcing tests”
      # that I explicitly disabled.
      # -----------------------------------------------------------------------

      run_tcp:
        description: "Run TCP/IP tests?"
        required: false
        default: "false"

      run_temp:
        description: "Run DS18B20 temperature test?"
        required: false
        default: "false"

      run_wifi:
        description: "Run Wi-Fi tests?"
        required: false
        default: "false"

      run_bt:
        description: "Run Bluetooth tests?"
        required: false
        default: "false"

      run_gps:
        description: "Run GPS tests?"
        required: true
        default: "true"

# ------------------------------------------------------------------------------
# CONCURRENCY — protects the physical board
# ------------------------------------------------------------------------------
#
# Only ONE workflow can talk to the ESP32 at a time.
#
# If a new run starts:
# - the previous one is cancelled,
# - avoiding USB contention,
# - corrupted serial communication,
# - or inconsistent test results.
# ------------------------------------------------------------------------------

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT
# ------------------------------------------------------------------------------

env:
  ESP_PORT: COM5
  FIRMWARE:  C:\ESP32_Wrover\ebesoh_esp32_wrover_projects\firmware\ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  # ==============================================================================
  # JOB 1 — INIT CI VARIABLES
  # ==============================================================================
  #
  # I initialize all “test passed” flags here so:
  # - the final summary job always has something to read,
  # - even if earlier jobs were skipped,
  # - and we don’t get empty or undefined values later.
  # ==============================================================================
  init-ci-vars:
    runs-on: self-hosted
    if: ${{ inputs.run_init == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TCP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

  # ==============================================================================
  # JOB 2 — AUTO CLEAN
  # ==============================================================================
  #
  # Simple guardrail so the self-hosted runner doesn’t run out of disk.
  #
  # If free space < 10 GB:
  # - wipe the workspace aggressively,
  # otherwise:
  # - leave it alone to save time.
  # ==============================================================================
  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars
    if: ${{ inputs.run_autoclean == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

  # ==============================================================================
  # JOB 3 — INSTALL HOST TOOLS
  # ==============================================================================
  #
  # Make sure the runner has exactly what we rely on:
  # - esptool  → flashing and low-level control
  # - mpremote → talking to MicroPython over serial
  # ==============================================================================
  install-tools:
    runs-on: self-hosted
    needs: auto-clean
    steps:
      - shell: cmd
        run: |
          where python
          python --version
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

  # ==============================================================================
  # JOB 4 — PREFLIGHT
  # ==============================================================================
  #
  # Basic sanity check:
  # Can we even talk to the ESP32 over USB?
  #
  # If this fails, likely causes are:
  # - bad cable,
  # - wrong COM port,
  # - board not powered,
  # - MicroPython not responding.
  #
  # If we can’t pass this, there is no point continuing.
  # ==============================================================================
  preflight:
    runs-on: self-hosted
    needs: install-tools
    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

  # ==============================================================================
  # JOB 5 — WAIT AFTER PREFLIGHT
  # ==============================================================================
  #
  # Give the board time to settle after reset.
  # USB serial can be flaky if we rush.
  # ==============================================================================
  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight
    if: ${{ inputs.run_wait_after_preflight == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

  # ==============================================================================
  # JOB 6 — FLASH FIRMWARE (MANUAL ONLY)
  # ==============================================================================
  #
  # This never runs automatically.
  # A human must explicitly click it.
  #
  # I keep this manual because flashing:
  # - changes board state,
  # - can introduce new failures,
  # - and should be a deliberate action.
  # ==============================================================================
  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_flash == 'true' }}
    steps:
      - shell: cmd
        run: |
          echo Erasing ESP32 flash...
          python -m esptool erase-flash --chip esp32 --port %ESP_PORT%
          
          echo Flashing firmware...
          python -m esptool write-flash --chip esp32 --port %ESP_PORT% -z 0x1000 "%FIRMWARE%"


  # ==============================================================================
  # JOB 7 — WAIT AFTER FLASH
  # ==============================================================================
  #
  # Two cases:
  # 1) Flashing was skipped → we proceed normally.
  # 2) Flashing ran → give the board time to reboot.
  #
  # If flashing truly failed, we stop.
  # ==============================================================================
  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware
    if: ${{ always() && needs.flash-firmware.result != 'failure' &&
            (inputs.run_wait_after_flash == 'true' || github.event_name == 'push') }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

  # ==============================================================================
  # JOB 8 — WAIT FOR REPL
  # ==============================================================================
  #
  # I actively poll until MicroPython responds.
  #
  # If it never prints "READY":
  # - firmware might be broken,
  # - board might be hung,
  # - or serial is unreliable.
  #
  # In that case, we fail fast.
  # ==============================================================================
  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing
    if: ${{ always() && needs.wait-after-flashing.result != 'failure' &&
            (inputs.run_wait_for_repl == 'true' || github.event_name == 'push') }}
    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

  # ==============================================================================
  # JOB 9 — UPLOAD TEST FILES
  # ==============================================================================
  #
  # Push all test runners onto the ESP32 filesystem.
  #
  # Even if some tests will later be skipped,
  # it’s simpler to upload everything once.
  # ==============================================================================
  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl
    if: ${{ always() && needs.wait-for-repl.result != 'failure' }}
    steps:
      - shell: cmd
        run: |
          for %%f in (test_tcp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (test_temp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_bt\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_gps\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_selftest_DS18B20_gps_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :

  # ==============================================================================
  # JOB 10 — SYSTEM SELF TEST (HARD GATE)
  # ==============================================================================
  #
  # This is the single, non-negotiable gate.
  #
  # If this fails:
  # - GPS is blocked,
  # - Wi-Fi is blocked,
  # - Bluetooth is blocked,
  # - Temperature is blocked,
  # - TCP is blocked.
  #
  # I treat this as:
  # “Is the system fundamentally healthy?”
  # ==============================================================================
  system-self-test:
    runs-on: self-hosted
    needs: upload-tests
    if: ${{ always() && needs.upload-tests.result != 'failure' }}
    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ==============================================================================
  # JOB 11 — TEMPERATURE TEST
  # ==============================================================================
  #
  # Clean rule:
  #   false = skip, always.
  #   true  = run.
  #
  # Full mode does NOT force this test.
  # ==============================================================================
  temp-test:
    runs-on: self-hosted
    needs: system-self-test
    if: ${{ always() &&
            needs.system-self-test.result != 'failure' &&
            inputs.run_temp == 'true' }}
    outputs:
      temp_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_ds18b20; test_runner_ds18b20.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ==============================================================================
  # JOB 12 — WIFI TEST
  # ==============================================================================
  #
  # I reset the board right before Wi-Fi tests.
  #
  # Why?
  # - Wi-Fi state can persist across resets,
  # - stale connections can make tests flaky,
  # - this gives me a clean baseline.
  # ==============================================================================
  wifi-test:
    runs-on: self-hosted
    needs: temp-test
    if: ${{ always() &&
            needs.temp-test.result != 'failure' &&
            inputs.run_wifi == 'true' }}
    outputs:
      wifi_passed: ${{ steps.result.outputs.passed }}
    steps:
      - shell: powershell
        run: |
          python -m mpremote connect $env:ESP_PORT reset *> $null
          Start-Sleep -Seconds 5
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_wifi_runner; test_wifi_runner.run_all_wifi_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ==============================================================================
  # JOB 13 — BLUETOOTH TEST
  # ==============================================================================
  #
  # Same philosophy as temperature and Wi-Fi:
  # if it’s false, it is skipped — no exceptions.
  # ==============================================================================
  bluetooth-test:
    runs-on: self-hosted
    needs: wifi-test
    if: ${{ always() &&
            needs.wifi-test.result != 'failure' &&
            inputs.run_bt == 'true' }}
    outputs:
      bt_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_bt; test_runner_bt.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ==============================================================================
  # JOB 14 — GPS TEST (SPECIAL BEHAVIOR)
  # ==============================================================================
  #
  # Exact behavior I designed:
  #
  # QUICK MODE:
  #   GPS runs right after system self-test.
  #
  # FULL MODE:
  #   GPS waits for Bluetooth ONLY IF Bluetooth actually ran.
  #
  # Critical rules:
  # - Only system self-test failure can block GPS.
  # - Skipped Bluetooth must NOT block GPS.
  #
  # The “needs: bluetooth-test” line is intentional.
  # GitHub marks it as “skipped” if not enabled,
  # and that will NOT block GPS due to the if-condition.
  # ==============================================================================
  gps-test:
    runs-on: self-hosted
    needs:
      - system-self-test
      - bluetooth-test
    if: ${{ always() &&
            needs.system-self-test.result != 'failure' &&
            inputs.run_gps == 'true' }}
    outputs:
      gps_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_gps; test_runner_gps.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ==============================================================================
  # JOB 15 — TCP TEST (PART OF QUICK MODE BY DEFAULT)
  # ==============================================================================
  #
  # My current choice:
  #
  # QUICK MODE → TCP runs after GPS by default.
  # FULL MODE  → TCP runs only if explicitly enabled.
  #
  # Only a real system self-test failure can block TCP.
  # ==============================================================================
  tcp-test:
    runs-on: self-hosted
    needs:
      - system-self-test
      - gps-test
    if: ${{ always() &&
            needs.system-self-test.result != 'failure' &&
            (inputs.test_mode == 'quick' || inputs.run_tcp == 'true') }}
    outputs:
      tcp_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_tcp; test_runner_tcp.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ==============================================================================
  # JOB 16 — FINAL VERDICT + SUMMARY
  # ==============================================================================
  #
  # This job:
  # 1) Prints a clear summary.
  # 2) Decides pass/fail.
  #
  # Key idea:
  # I only fail if a test actually RAN and returned false.
  # “skipped” is implicitly acceptable.
  # ==============================================================================
  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
      - temp-test
      - wifi-test
      - bluetooth-test
      - gps-test
      - tcp-test
    if: ${{ always() }}
    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
          $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
          $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
          $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"
          $GPS  = "${{ needs.gps-test.outputs.gps_passed }}"
          $TCP  = "${{ needs.tcp-test.outputs.tcp_passed }}"

          Write-Host ""
          Write-Host "================== TEST SUMMARY =================="
          Write-Host "SYSTEM SELF-TEST  : $SELF"
          Write-Host "TEMPERATURE TEST  : $TEMP"
          Write-Host "WIFI TEST         : $WIFI"
          Write-Host "BLUETOOTH TEST    : $BT"
          Write-Host "GPS TEST          : $GPS"
          Write-Host "TCP TEST          : $TCP"
          Write-Host "=================================================="
          Write-Host ""

          $failed = $false

          if ($SELF -eq "false") { $failed = $true }
          if ($TEMP -eq "false") { $failed = $true }
          if ($WIFI -eq "false") { $failed = $true }
          if ($BT   -eq "false") { $failed = $true }
          if ($GPS  -eq "false") { $failed = $true }
          if ($TCP  -eq "false") { $failed = $true }

          if ($failed) {
            throw "Final verdict: One or more functional tests failed"
          }

          Write-Host "FINAL VERDICT: ALL REQUIRED TESTS PASSED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"
