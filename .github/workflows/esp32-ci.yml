name: ESP32-WROVER DEVKIT CI

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      run_init:
        description: "Run JOB 1 — Init CI variables?"
        required: true
        default: "true"

      run_autoclean:
        description: "Run JOB 2 — Auto-clean workspace?"
        required: true
        default: "true"

      run_wait_after_preflight:
        description: "Run JOB 5 — Wait after preflight?"
        required: true
        default: "true"

      run_flash:
        description: "Run JOB 6 — Flash firmware? (MANUAL ONLY)"
        required: false
        default: "false"

      run_wait_after_flash:
        description: "Run JOB 7 — Wait after flashing?"
        required: true
        default: "true"

      run_wait_for_repl:
        description: "Run JOB 8 — Wait for MicroPython REPL?"
        required: true
        default: "true"

      test_mode:
        description: "Test mode: quick or full?"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

      run_tcp:
        description: "Run TCP/IP tests?"
        required: false
        default: "false"

      run_temp:
        description: "Run DS18B20 temperature test?"
        required: false
        default: "false"

      run_wifi:
        description: "Run Wi-Fi tests?"
        required: false
        default: "false"

      run_bt:
        description: "Run Bluetooth tests?"
        required: false
        default: "false"

      run_gps:
        description: "Run GPS tests?"
        required: true
        default: "true"

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

env:
  ESP_PORT: COM5
  FIRMWARE: "C:\\ESP32_Wrover\\ebesoh_esp32_wrover_projects\\firmware\\ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin"
  PYTHONUNBUFFERED: "1"

jobs:

  # ========================== JOB 1 — INIT ==========================
  init-ci-vars:
    runs-on: self-hosted
    if: ${{ inputs.run_init == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TCP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

  # ========================== JOB 2 — AUTO CLEAN ==========================
  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars
    if: ${{ inputs.run_autoclean == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

  # ========================== JOB 3 — INSTALL TOOLS ==========================
  install-tools:
    runs-on: self-hosted
    needs: auto-clean
    steps:
      - shell: cmd
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

  # ========================== JOB 4 — PREFLIGHT ==========================
  preflight:
    runs-on: self-hosted
    needs: install-tools
    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...

          python -m mpremote connect %ESP_PORT% exec "print('OK')" || (
            echo "Preflight failed: cannot communicate with ESP32"
            exit /b 1
          )

  # ========================== JOB 5 — WAIT AFTER PREFLIGHT ==========================
  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight
    if: ${{ inputs.run_wait_after_preflight == 'true' || github.event_name == 'push' }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

  # ========================== JOB 6 — FLASH FIRMWARE (MANUAL) ==========================
  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_flash == 'true' }}
    steps:
      - shell: cmd
        run: |
          echo Erasing ESP32 flash...
          python -m esptool erase-flash --chip esp32 --port %ESP_PORT%

          echo Flashing firmware...
          python -m esptool write-flash --chip esp32 --port %ESP_PORT% -z 0x1000 "%FIRMWARE%"

  # ========================== JOB 7 — WAIT AFTER FLASH ==========================
  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware
    if: ${{ always() && needs.flash-firmware.result != 'failure' &&
            (inputs.run_wait_after_flash == 'true' || github.event_name == 'push') }}
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

  # ========================== JOB 8 — WAIT FOR REPL ==========================
  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing
    if: ${{ always() && needs.wait-after-flashing.result != 'failure' &&
            (inputs.run_wait_for_repl == 'true' || github.event_name == 'push') }}
    steps:
      - shell: cmd
        run: |
          echo Waiting for MicroPython to be responsive...

          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')" && (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )

          :done
          if "%READY%"=="0" (
            echo "ERROR: MicroPython did not respond"
            exit /b 1
          )

  # ========================== JOB 9 — UPLOAD TEST FILES (FIXED) ==========================
  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl
    if: ${{ always() && needs.wait-for-repl.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - shell: cmd
        run: |
          echo "=============================================="
          echo "Checking test folders before upload..."
          echo "=============================================="

          set UPLOADED_ANY=0

          REM --- Upload ROOT test runners first ---
          for %%f in (*.py) do (
            echo Uploading root file %%f
            python -m mpremote connect %ESP_PORT% fs cp "%%f" :
            if errorlevel 1 (
              echo "ERROR: Failed to upload %%f"
              exit /b 1
            )
            set UPLOADED_ANY=1
          )

          REM --- Now upload folders if they exist ---

          if exist test_tcp (
            echo "Found folder: test_tcp"
            for %%f in (test_tcp\*.py) do (
              echo Uploading %%f
              python -m mpremote connect %ESP_PORT% fs cp "%%f" :
              if errorlevel 1 (
                echo "ERROR: Failed to upload %%f"
                exit /b 1
              )
              set UPLOADED_ANY=1
            )
          ) else (
            echo "WARNING: Folder test_tcp does NOT exist — skipping"
          )

          if exist test_temp (
            echo "Found folder: test_temp"
            for %%f in (test_temp\*.py) do (
              echo Uploading %%f
              python -m mpremote connect %ESP_PORT% fs cp "%%f" :
              if errorlevel 1 (
                echo "ERROR: Failed to upload %%f"
                exit /b 1
              )
              set UPLOADED_ANY=1
            )
          ) else (
            echo "WARNING: Folder test_temp does NOT exist — skipping"
          )

          if exist tests_wifi (
            echo "Found folder: tests_wifi"
            for %%f in (tests_wifi\*.py) do (
              echo Uploading %%f
              python -m mpremote connect %ESP_PORT% fs cp "%%f" :
              if errorlevel 1 (
                echo "ERROR: Failed to upload %%f"
                exit /b 1
              )
              set UPLOADED_ANY=1
            )
          ) else (
            echo "WARNING: Folder tests_wifi does NOT exist — skipping"
          )

          if exist tests_bt (
            echo "Found folder: tests_bt"
            for %%f in (tests_bt\*.py) do (
              echo Uploading %%f
              python -m mpremote connect %ESP_PORT% fs cp "%%f" :
              if errorlevel 1 (
                echo "ERROR: Failed to upload %%f"
                exit /b 1
              )
              set UPLOADED_ANY=1
            )
          ) else (
            echo "WARNING: Folder tests_bt does NOT exist — skipping"
          )

          if exist tests_gps (
            echo "Found folder: tests_gps"
            for %%f in (tests_gps\*.py) do (
              echo Uploading %%f
              python -m mpremote connect %ESP_PORT% fs cp "%%f" :
              if errorlevel 1 (
                echo "ERROR: Failed to upload %%f"
                exit /b 1
              )
              set UPLOADED_ANY=1
            )
          ) else (
            echo "WARNING: Folder tests_gps does NOT exist — skipping"
          )

          if exist test_selftest_DS18B20_gps_wifi (
            echo "Found folder: test_selftest_DS18B20_gps_wifi"
            for %%f in (test_selftest_DS18B20_gps_wifi\*.py) do (
              echo Uploading %%f
              python -m mpremote connect %ESP_PORT% fs cp "%%f" :
              if errorlevel 1 (
                echo "ERROR: Failed to upload %%f"
                exit /b 1
               )
              set UPLOADED_ANY=1
             )
           ) else (
             echo "WARNING: Folder test_selftest_DS18B20_gps_wifi does NOT exist — skipping"
          )

          echo ""
          echo "Verifying files on ESP32:"
          python -m mpremote connect %ESP_PORT% exec "import os; print(os.listdir())"

          if "%UPLOADED_ANY%"=="0" (
            echo "ERROR: No test files were uploaded at all."
            exit /b 1
          )

          echo "Upload step completed."

  # ========================== JOB 10 — SYSTEM SELF TEST ==========================
  system-self-test:
    runs-on: self-hosted
    needs: upload-tests
    if: ${{ always() && needs.upload-tests.result != 'failure' }}
    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

  # ========================== JOB 16 — FINAL VERDICT ==========================
  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
    if: ${{ always() }}
    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"

          Write-Host ""
          Write-Host "================== TEST SUMMARY =================="
          Write-Host "SYSTEM SELF-TEST  : $SELF"
          Write-Host "=================================================="
          Write-Host ""

          if ($SELF -eq "false") {
            throw "Final verdict: System self-test failed"
          }

          Write-Host "FINAL VERDICT: ALL REQUIRED TESTS PASSED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"
