# ==============================================================================
# ESP32-WROVER DEVKIT CI — GitHub Actions (Hardware-in-the-Loop)
# Author: Ebesoh Ebesoh
# ==============================================================================
#
# WHAT THIS WORKFLOW DOES
# ----------------------
# This is a real hardware CI pipeline for ESP32-WROVER boards running
# MicroPython.
#
# There’s no simulation here. No mocks. No shortcuts.
# Every step talks to an actual ESP32 over USB, flashes it, loads test code,
# runs the tests on the board itself, and then decides—very clearly—whether
# things passed or failed.
#
# The goal is simple: when this pipeline is green, you can trust the hardware functionalities verified in this pipeline.
#
# ------------------------------------------------------------------------------
#
# HOW THE PIPELINE FLOWS
# ---------------------
# The workflow is split into multiple dependent jobs so each phase is explicit
# and easy to reason about.
#
# 1. Runner preparation
#    The runner gets itself into a clean, predictable state:
#    - CI state variables are initialized
#    - Disk space is checked and cleaned if needed
#    - Required tools (Python, esptool, mpremote) are installed
#
# 2. Hardware bring-up
#    The ESP32 is reset to a known-good baseline:
#    - USB connectivity is verified
#    - Flash is fully erased
#    - A specific MicroPython firmware image is installed
#    - The workflow waits until the REPL actually responds
#
# 3. Test deployment
#    All test modules are copied directly onto the ESP32 filesystem using
#    mpremote. Nothing runs from the host once testing begins.
#
# 4. Tests run (in a strict order)
#    Tests are executed one at a time, on purpose:
#    - System self-test (hard gate)
#    - DS18B20 temperature sensor test
#    - Soft reset to clear network state
#    - Wi-Fi functional tests
#    - Bluetooth (BLE) functional tests
#    - GPS (GT-U7) functional tests
#
# 5. Final verdict
#    Results from all test jobs are collected.
#    The workflow produces one final answer: PASS or FAIL.
#    Logs are archived so failures can be understood, not guessed.
#
# ------------------------------------------------------------------------------
#
# WHY IT’S BUILT THIS WAY
# ----------------------
#
# • HARD GATES
#   The system self-test must pass. If it doesn’t, nothing else runs.
#   That avoids false confidence from later tests.
#
# • STATE ISOLATION
#   A deliberate reset is done before Wi-Fi tests to clear out radios,
#   sockets, and driver state from earlier stages.
#
# • ONE SOURCE OF TRUTH
#   Each test suite explicitly reports success or failure.
#   The CI doesn’t “infer” results—it reads clear verdicts.
#
# • DETERMINISM OVER SPEED
#   Tests run sequentially. Shared hardware and parallel execution don’t mix
#   well, and reliability matters more than shaving seconds.
#
# • HARDWARE SAFETY
#   The workflow assumes exclusive access to the ESP32.
#   Concurrency is intentionally restricted to protect the device.
#
# ------------------------------------------------------------------------------
#
# LOGS AND RESULTS
# ----------------
# - All test output is written to log files
# - CI decisions are based only on explicit pass/fail signals
# - Logs are always uploaded, even when something breaks
# - The final workflow result is clear and final
#
# ------------------------------------------------------------------------------
#
# WHEN THIS WORKFLOW MAKES SENSE
# ------------------------------
# - Self-hosted GitHub Actions runners with USB access to real hardware
# - Firmware, driver, or board-level development
# - Regression testing after changes to code or hardware
#
# This workflow is intentionally conservative.
# It favors clarity, repeatability, scalbility, and trust over cleverness or speed.
# More test suite could easily be added to the pipeline
# ==============================================================================

name: ESP32-WROVER DEVKIT CI

# ------------------------------------------------------------------------------
# Workflow triggers
# ------------------------------------------------------------------------------
# Runs automatically on pushes to main
# Can also be triggered manually from the GitHub UI
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ------------------------------------------------------------------------------
# Concurrency control
# ------------------------------------------------------------------------------
# Prevents multiple workflows from accessing the same physical ESP32 at once
concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# Global environment variables
# ------------------------------------------------------------------------------
# Shared across all jobs
env:
  ESP_PORT: COM5                          # USB serial port for ESP32
  FIRMWARE: firmware/ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"                   # Ensure real-time Python output

jobs:

# ==============================================================================
# JOB 1 — INIT CI VARIABLES
# ==============================================================================
# Initializes mutable CI state used across downstream jobs
# These values act as explicit pass/fail markers
  init-ci-vars:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4         # Checkout repository (required by Actions)
      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

# ==============================================================================
# JOB 2 — AUTO CLEAN
# ==============================================================================
# Frees disk space on the runner if storage is critically low
  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars
    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

# ==============================================================================
# JOB 3 — INSTALL HOST TOOLS
# ==============================================================================
# Installs all required host-side tooling for flashing and control
  install-tools:
    runs-on: self-hosted
    needs: auto-clean
    steps:
      - shell: cmd
        run: |
          where python                          # Verify Python path
          python --version                     # Log Python version
          python -c "import serial.tools.list_ports; print([p.device for p in serial.tools.list_ports.comports()])"
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

# ==============================================================================
# JOB 4 — PREFLIGHT
# ==============================================================================
# Verifies ESP32 is reachable over USB before doing anything destructive
  preflight:
    runs-on: self-hosted
    needs: install-tools
    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

# ==============================================================================
# JOB 5 — WAIT AFTER PREFLIGHT
# ==============================================================================
# Allows USB stack and device reset to settle
  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 6 — FLASH FIRMWARE
# ==============================================================================
# Fully erases flash and installs a known MicroPython firmware image
  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight
    steps:
      - shell: cmd
        run: |
          python -m esptool --chip esp32 --port %ESP_PORT% erase-flash
          python -m esptool --chip esp32 --port %ESP_PORT% write-flash -z 0x1000 %FIRMWARE%

# ==============================================================================
# JOB 7 — WAIT AFTER FLASH
# ==============================================================================
# Gives the ESP32 time to reboot cleanly after flashing
  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware
    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 8 — WAIT FOR REPL
# ==============================================================================
# Polls the MicroPython REPL until it responds
# Fails if the board never becomes ready
  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing
    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

# ==============================================================================
# JOB 9 — UPLOAD TEST FILES
# ==============================================================================
# Copies all test modules onto the ESP32 filesystem
  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl
    steps:
      - shell: cmd
        run: |
          for %%f in (test_temp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_bt\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_gps\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_selftest_DS18B20_gps_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :

# ==============================================================================
# JOB 10 — SYSTEM SELF TEST
# ==============================================================================
# Hard gate: pipeline stops immediately if this fails
  system-self-test:
    runs-on: self-hosted
    needs: upload-tests
    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 11 — TEMPERATURE TEST
# ==============================================================================
# DS18B20 temperature sensor validation
  temp-test:
    runs-on: self-hosted
    needs: system-self-test
    outputs:
      temp_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_ds18b20; test_runner_ds18b20.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 12 — WIFI TEST
# ==============================================================================
# Includes a soft reset to clear radio and network state
  wifi-test:
    runs-on: self-hosted
    needs: temp-test
    outputs:
      wifi_passed: ${{ steps.result.outputs.passed }}
    steps:
      - shell: powershell
        run: |
          python -m mpremote connect $env:ESP_PORT reset *> $null
          Start-Sleep -Seconds 5
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_wifi_runner; test_wifi_runner.run_all_wifi_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 13 — BLUETOOTH TEST
# ==============================================================================
# Executes BLE functional validation
  bluetooth-test:
    runs-on: self-hosted
    needs: wifi-test
    outputs:
      bt_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_bt; test_runner_bt.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 14 — GPS TEST
# ==============================================================================
# Validates GT-U7 GPS module via UART and NMEA parsing
  gps-test:
    runs-on: self-hosted
    needs: bluetooth-test
    outputs:
      gps_passed: ${{ steps.result.outputs.passed }}
    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_gps; test_runner_gps.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 15 — FINAL VERDICT
# ==============================================================================
# Single authoritative CI decision based on all upstream results
  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
      - temp-test
      - wifi-test
      - bluetooth-test
      - gps-test
    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
          $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
          $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
          $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"
          $GPS  = "${{ needs.gps-test.outputs.gps_passed }}"

          if ($SELF -ne "true" -or $TEMP -ne "true" -or $WIFI -ne "true" -or $BT -ne "true" -or $GPS -ne "true") {
            throw "Final verdict: One or more functional tests failed"
          }

          Write-Host "FINAL VERDICT: ALL TESTS PASSED"

      # Always archive logs for traceability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"




