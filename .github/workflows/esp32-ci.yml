# ==============================================================================
# ESP32-WROVER DEVKIT CI — GitHub Actions
# ==============================================================================
#
# BIG PICTURE
# -----------
# This workflow treats your ESP32 as real hardware under test, not a simulator.
# A green run means: "the physical board behaved correctly."
# A red run means:   "something in the real system regressed."
#
# DESIGN PHILOSOPHY
# ------------------
# 1) Bring the board to a known, sane state.
# 2) Run a mandatory system self-test (hard gate).
# 3) Run optional tests only when explicitly requested.
# 4) Treat skipped steps as acceptable, not as failures.
# 5) Never flash on push — flashing is manual and intentional.
# 6) Never let two workflows fight over the same board.
#
# MENTAL MODEL (3 PHASES)
# -----------------------
# Phase 1 — Setup:
#   Make sure the runner has Python, esptool, and mpremote.
#
# Phase 2 — Hardware Bring-Up:
#   - Check that the ESP32 is reachable (preflight).
#   - Optionally wait.
#   - Optionally flash.
#   - Optionally wait again.
#   - Optionally wait for MicroPython REPL.
#
# Phase 3 — Testing:
#   - Upload test files.
#   - Run mandatory system self-test.
#   - Run optional tests (temp, Wi-Fi, BT, GPS) only if toggled.
#   - Print a readable summary.
#   - Make a final PASS/FAIL decision (skipped = pass).
#
# ==============================================================================

name: ESP32-WROVER DEVKIT CI

# ------------------------------------------------------------------------------
# TRIGGERS + MANUAL TOGGLES
# ------------------------------------------------------------------------------

on:
  # NORMAL CI MODE
  # Runs automatically on every push to main.
  push:
    branches: [ main ]

  # MANUAL MODE
  # Gives you a UI control panel in GitHub where you can enable/disable steps.
  workflow_dispatch:
    inputs:

      # ----------------------------
      # SETUP / BRING-UP CONTROLS
      # ----------------------------

      run_init:
        description: "Run JOB 1 — Init CI variables?"
        required: true
        default: "true"
        # Why this exists:
        # Initializes environment variables that track test results.
        # Normally you leave this on.

      run_autoclean:
        description: "Run JOB 2 — Auto-clean workspace?"
        required: true
        default: "true"
        # Defensive step to avoid disk-space failures on the self-hosted runner.

      run_wait_after_preflight:
        description: "Run JOB 5 — Wait after preflight?"
        required: true
        default: "true"
        # Gives USB and the ESP32 time to settle before doing anything risky.

      # ----------------------------
      # FLASH CONTROL (MANUAL ONLY)
      # ----------------------------
      #
      # CRITICAL RULE:
      # - Default = false
      # - Pushes NEVER flash.
      # - You must explicitly enable this in a manual run.

      run_flash:
        description: "Run JOB 6 — Flash firmware? (MANUAL ONLY)"
        required: false
        default: "false"

      run_wait_after_flash:
        description: "Run JOB 7 — Wait after flashing?"
        required: true
        default: "true"
        # Helps avoid timing issues right after a flash.

      run_wait_for_repl:
        description: "Run JOB 8 — Wait for MicroPython REPL?"
        required: true
        default: "true"
        # Polls until MicroPython is responsive.

      # ----------------------------
      # TEST TOGGLES (AFTER OUR FIX)
      # ----------------------------
      #
      # KEY BEHAVIOR:
      # - A test runs ONLY if its toggle is "true".
      # - There is NO hidden "auto-run-on-push" behavior anymore.

      run_temp:
        description: "Run DS18B20 temperature test?"
        required: false
        default: "false"

      run_wifi:
        description: "Run Wi-Fi tests?"
        required: false
        default: "false"

      run_bt:
        description: "Run Bluetooth tests?"
        required: false
        default: "false"

      run_gps:
        description: "Run GPS tests?"
        required: true
        default: "true"

# ------------------------------------------------------------------------------
# CONCURRENCY — HARDWARE SAFETY
# ------------------------------------------------------------------------------
# Only one workflow can talk to the physical ESP32 at a time.
# If a new run starts, the previous one is canceled.
# ------------------------------------------------------------------------------

concurrency:
  group: esp32-wrover-hil
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# GLOBAL ENVIRONMENT
# ------------------------------------------------------------------------------

env:
  ESP_PORT: COM5
  FIRMWARE: firmware/ESP32_GENERIC-SPIRAM-20251209-v1.27.0.bin
  PYTHONUNBUFFERED: "1"

# ==============================================================================
# JOBS
# ==============================================================================

# ==============================================================================
# JOB 1 — INIT CI VARIABLES
# ==============================================================================
# Creates a predictable baseline for all test results.
# Even if some tests are skipped, we still have clean variables.
# ==============================================================================

jobs:
  init-ci-vars:
    runs-on: self-hosted

    # Runs on:
    # - any push to main
    # - OR a manual run where the user left this enabled
    if: ${{ inputs.run_init == 'true' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - shell: powershell
        run: |
          "SELF_TEST_PASSED=false" | Out-File -Append $env:GITHUB_ENV
          "WIFI_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "TEMP_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "BT_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "GPS_TEST_PASSED=unknown" | Out-File -Append $env:GITHUB_ENV
          "FAILED_TESTS=" | Out-File -Append $env:GITHUB_ENV

# ==============================================================================
# JOB 2 — AUTO CLEAN
# ==============================================================================
# Defensive cleanup to avoid random disk-space failures.
# ==============================================================================

  auto-clean:
    runs-on: self-hosted
    needs: init-ci-vars

    # Same logic as init:
    # runs on push OR if manually enabled
    if: ${{ inputs.run_autoclean == 'true' || github.event_name == 'push' }}

    steps:
      - shell: powershell
        run: |
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          if ($freeGb -lt 10) {
            Get-ChildItem -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

# ==============================================================================
# JOB 3 — INSTALL HOST TOOLS
# ==============================================================================
# Ensures esptool and mpremote are available on the runner.
# ==============================================================================

  install-tools:
    runs-on: self-hosted
    needs: auto-clean

    steps:
      - shell: cmd
        run: |
          where python
          python --version
          python -c "import serial.tools.list_ports; print([p.device for p in serial.tools.list_ports.comports()])"
          python -m pip install --upgrade pip
          python -m pip install esptool mpremote

# ==============================================================================
# JOB 4 — PREFLIGHT
# ==============================================================================
# First real hardware check:
# Can we even talk to the ESP32 over USB?
# If this fails, everything stops.
# ==============================================================================

  preflight:
    runs-on: self-hosted
    needs: install-tools

    steps:
      - shell: cmd
        run: |
          echo Preflight: checking ESP32 on %ESP_PORT%...
          python -m mpremote connect %ESP_PORT% reset
          if errorlevel 1 exit /b 1

# ==============================================================================
# JOB 5 — WAIT AFTER PREFLIGHT
# ==============================================================================
# Gives USB and the board time to stabilize.
# ==============================================================================

  wait-after-preflight:
    runs-on: self-hosted
    needs: preflight

    if: ${{ inputs.run_wait_after_preflight == 'true' || github.event_name == 'push' }}

    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 6 — FLASH FIRMWARE (MANUAL ONLY)
# ==============================================================================
# This wipes the board and installs a clean MicroPython image.
# NEVER runs on push — only on manual runs with the toggle enabled.
# ==============================================================================

  flash-firmware:
    runs-on: self-hosted
    needs: wait-after-preflight

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_flash == 'true' }}

    steps:
      - shell: cmd
        run: |
          python -m esptool --chip esp32 --port %ESP_PORT% erase_flash
          python -m esptool --chip esp32 --port %ESP_PORT% write_flash -z 0x1000 %FIRMWARE%

# ==============================================================================
# JOB 7 — WAIT AFTER FLASH (SKIP-TOLERANT)
# ==============================================================================
# Runs if flash succeeded OR if flash was skipped.
# Does NOT run if flash actually failed.
# ==============================================================================

  wait-after-flashing:
    runs-on: self-hosted
    needs: flash-firmware

    if: ${{ always() && needs.flash-firmware.result != 'failure' &&
            (inputs.run_wait_after_flash == 'true' || github.event_name == 'push') }}

    steps:
      - shell: powershell
        run: Start-Sleep -Seconds 15

# ==============================================================================
# JOB 8 — WAIT FOR REPL (SKIP-TOLERANT)
# ==============================================================================
# Polls MicroPython until it responds.
# ==============================================================================

  wait-for-repl:
    runs-on: self-hosted
    needs: wait-after-flashing

    if: ${{ always() && needs.wait-after-flashing.result != 'failure' &&
            (inputs.run_wait_for_repl == 'true' || github.event_name == 'push') }}

    steps:
      - shell: cmd
        run: |
          set READY=0
          for /L %%i in (1,1,5) do (
            python -m mpremote connect %ESP_PORT% exec "print('READY')"
            if not errorlevel 1 (
              set READY=1
              goto done
            )
            timeout /t 3 >nul
          )
          :done
          if "%READY%"=="0" exit /b 1

# ==============================================================================
# JOB 9 — UPLOAD TEST FILES
# ==============================================================================
# Copies all test modules onto the ESP32 filesystem.
# ==============================================================================

  upload-tests:
    runs-on: self-hosted
    needs: wait-for-repl

    # Runs even if earlier optional steps were skipped,
    # as long as nothing actually failed.
    if: ${{ always() && needs.wait-for-repl.result != 'failure' }}

    steps:
      - shell: cmd
        run: |
          for %%f in (test_temp\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_bt\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_gps\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :
          for %%f in (tests_selftest_DS18B20_gps_wifi\*.py) do python -m mpremote connect %ESP_PORT% fs cp "%%f" :

# ==============================================================================
# JOB 10 — SYSTEM SELF TEST (HARD GATE)
# ==============================================================================
# This must run unless something actually failed earlier.
# Skipped steps do NOT block this anymore.
# ==============================================================================

  system-self-test:
    runs-on: self-hosted
    needs: upload-tests

    if: ${{ always() && needs.upload-tests.result != 'failure' }}

    outputs:
      self_test_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_system; test_runner_system.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 11 — TEMPERATURE TEST (FIXED)
# ==============================================================================
# Runs ONLY if:
# - system-self-test did NOT fail
# - AND the user explicitly enabled run_temp = true
# ==============================================================================

  temp-test:
    runs-on: self-hosted
    needs: system-self-test

    if: ${{ always() && needs.system-self-test.result != 'failure' &&
            inputs.run_temp == 'true' }}

    outputs:
      temp_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_ds18b20; test_runner_ds18b20.main()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 12 — WIFI TEST (FIXED)
# ==============================================================================
# Same logic as temp-test, but also soft-resets the board first.
# ==============================================================================

  wifi-test:
    runs-on: self-hosted
    needs: temp-test

    if: ${{ always() && needs.temp-test.result != 'failure' &&
            inputs.run_wifi == 'true' }}

    outputs:
      wifi_passed: ${{ steps.result.outputs.passed }}

    steps:
      - shell: powershell
        run: |
          python -m mpremote connect $env:ESP_PORT reset *> $null
          Start-Sleep -Seconds 5

      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_wifi_runner; test_wifi_runner.run_all_wifi_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 13 — BLUETOOTH TEST (FIXED)
# ==============================================================================

  bluetooth-test:
    runs-on: self-hosted
    needs: wifi-test

    if: ${{ always() && needs.wifi-test.result != 'failure' &&
            inputs.run_bt == 'true' }}

    outputs:
      bt_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_bt; test_runner_bt.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 14 — GPS TEST (FIXED)
# ==============================================================================

  gps-test:
    runs-on: self-hosted
    needs: bluetooth-test

    if: ${{ always() && needs.bluetooth-test.result != 'failure' &&
            inputs.run_gps == 'true' }}

    outputs:
      gps_passed: ${{ steps.result.outputs.passed }}

    steps:
      - id: result
        shell: cmd
        run: |
          python -m mpremote connect %ESP_PORT% exec "import test_runner_gps; test_runner_gps.run_all_tests()"
          if errorlevel 1 (
            echo passed=false>>"%GITHUB_OUTPUT%"
            exit /b 1
          ) else (
            echo passed=true>>"%GITHUB_OUTPUT%"
          )

# ==============================================================================
# JOB 15 — FINAL VERDICT + READABLE SUMMARY
# ==============================================================================
# Always runs.
# Treats skipped tests as PASS.
# ==============================================================================

  final-verdict:
    runs-on: self-hosted
    needs:
      - system-self-test
      - temp-test
      - wifi-test
      - bluetooth-test
      - gps-test

    if: ${{ always() }}

    steps:
      - shell: powershell
        run: |
          $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
          $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
          $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
          $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"
          $GPS  = "${{ needs.gps-test.outputs.gps_passed }}"

          # If a job was skipped, GitHub gives us an empty string.
          # We display it clearly in the summary.

          if ($SELF -eq "") { $SELF = "skipped" }
          if ($TEMP -eq "") { $TEMP = "skipped" }
          if ($WIFI -eq "") { $WIFI = "skipped" }
          if ($BT   -eq "") { $BT   = "skipped" }
          if ($GPS  -eq "") { $GPS  = "skipped" }

          Write-Host ""
          Write-Host "================== TEST SUMMARY =================="
          Write-Host "SYSTEM SELF-TEST : $SELF"
          Write-Host "TEMPERATURE TEST : $TEMP"
          Write-Host "WIFI TEST        : $WIFI"
          Write-Host "BLUETOOTH TEST   : $BT"
          Write-Host "GPS TEST         : $GPS"
          Write-Host "=================================================="
          Write-Host ""

          # For the final decision, treat "skipped" as PASS.
          if ($SELF -eq "skipped") { $SELF = "true" }
          if ($TEMP -eq "skipped") { $TEMP = "true" }
          if ($WIFI -eq "skipped") { $WIFI = "true" }
          if ($BT   -eq "skipped") { $BT   = "true" }
          if ($GPS  -eq "skipped") { $GPS  = "true" }

          if ($SELF -ne "true" -or $TEMP -ne "true" -or $WIFI -ne "true" -or $BT -ne "true" -or $GPS -ne "true") {
            throw "Final verdict: One or more functional tests failed"
          }

          Write-Host "FINAL VERDICT: ALL TESTS PASSED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-ci-logs
          path: "*.txt"
