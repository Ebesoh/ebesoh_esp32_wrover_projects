# ==============================================================================
# JOB 15 — FINAL VERDICT + READABLE SUMMARY (CLEAN VERSION)
# ==============================================================================
#
# Same intent as before, but simpler logic:
#
# - If a test actually ran AND returned "false" → the pipeline fails.
# - If a test was skipped (empty output) → that is not a failure.
# - If a test ran and passed → fine.
#
# This avoids all the “skipped → true” conversions and string juggling.
# ==============================================================================
final-verdict:
  runs-on: self-hosted
  needs:
    - system-self-test
    - temp-test
    - wifi-test
    - bluetooth-test
    - gps-test
  if: ${{ always() }}
  steps:
    - shell: powershell
      run: |
        $MODE = "${{ inputs.test_mode }}"

        $SELF = "${{ needs.system-self-test.outputs.self_test_passed }}"
        $TEMP = "${{ needs.temp-test.outputs.temp_passed }}"
        $WIFI = "${{ needs.wifi-test.outputs.wifi_passed }}"
        $BT   = "${{ needs.bluetooth-test.outputs.bt_passed }}"
        $GPS  = "${{ needs.gps-test.outputs.gps_passed }}"

        Write-Host ""
        Write-Host "================== TEST SUMMARY =================="
        Write-Host "MODE              : $MODE"
        Write-Host "SYSTEM SELF-TEST  : $SELF"
        Write-Host "TEMPERATURE TEST  : $TEMP"
        Write-Host "WIFI TEST         : $WIFI"
        Write-Host "BLUETOOTH TEST    : $BT"
        Write-Host "GPS TEST          : $GPS"
        Write-Host "=================================================="
        Write-Host ""

        # ---- Cleaner verdict logic ----
        # Only fail if something actually ran and returned false.
        $fail = $false

        if ($SELF -eq "false") { $fail = $true }
        if ($TEMP -eq "false") { $fail = $true }
        if ($WIFI -eq "false") { $fail = $true }
        if ($BT   -eq "false") { $fail = $true }
        if ($GPS  -eq "false") { $fail = $true }

        if ($fail) {
          throw "Final verdict: One or more functional tests failed"
        }

        Write-Host "FINAL VERDICT: ALL TESTS PASSED"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: esp32-ci-logs
        path: "*.txt"
